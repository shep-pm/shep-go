name: commits
# Rejects a pull request carrying a commit subject release-please cannot
# parse.
#
# release-please parses commits against the conventionalcommits.org spec.
# An unparsed subject gets no changelog entry and no version bump, even
# if breaking.

on:
  pull_request:

permissions:
  contents: read

jobs:
  conventional:
    name: conventional subjects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: a subject is only checkable if it is fetched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check every commit subject on this branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # --no-merges: release-please skips merges, so a `!` on a merge
          # subject or PR title never reaches it.
          #
          # No exemptions here: an unsquashed fixup!/squash!/amend! commit
          # or a `git revert` subject parses as nothing, like other
          # unreadable subjects.
          #
          # release-please's own parser gives feat/fix/perf/refactor an
          # entry and skips docs/test/ci/chore/style unless breaking. It
          # silently drops revert/build: neither matches a parser at all.
          #
          # A `!` after the type marks a breaking change even on
          # docs/chore, per the spec. It cannot rescue revert/build, which
          # match no parser regardless of `!`. Refuse those two rather
          # than silently drop a breaking change.
          #
          # Scope allows any character except parentheses, per the spec,
          # so `feat(API): ...` is valid.
          bad=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if printf '%s' "$subject" | grep -qE '^(feat|fix|perf|refactor|docs|test|ci|chore|style)(\([^()]+\))?!?: .+'; then
              printf '  ok      %s\n' "$subject"
            else
              printf '  DROPPED %s\n' "$subject"
              bad=$((bad + 1))
            fi
          done <<EOF
          $(git log --no-merges --format='%s' "$BASE..$HEAD")
          EOF

          if [ "$bad" -gt 0 ]; then
            cat >&2 <<MSG

          $bad commit subject(s) above will be dropped by release-please.

          Each one contributes nothing to the changelog and nothing to the
          version bump. If any of them changes a public API, that change
          ships inside a semver-compatible version and nothing reports it.

          Rewrite them as: type(optional-scope): lowercase summary

          Put a ! after the type or scope on the commit that actually
          breaks something. A ! on this pull request's title does nothing,
          because release-please never reads the merge commit.
          MSG
            exit 1
          fi
          echo "All $(git log --no-merges --oneline "$BASE..$HEAD" | wc -l | tr -d ' ') commit subject(s) are readable."
