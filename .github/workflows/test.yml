name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  channel:
    name: channel (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The floor and the current release. The floor is what go.mod
        # claims, so it is tested rather than assumed.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24", "stable"]
    defaults:
      run:
        working-directory: channel
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        # bash on every runner: the Windows default shell is pwsh, where
        # this is not a command.
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      # -race everywhere, deliberately. This module is two goroutines
      # around one shared handle. That is the shape the detector exists
      # for. It needs a C toolchain, which every runner image ships.
      - name: test
        run: go test -race ./...

  example:
    name: example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/answers
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - name: build
        run: go build ./...

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
