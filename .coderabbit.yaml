# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CodeRabbit review settings. Everything here is a deviation from a default,
# so a key that is absent is deliberate: it means the default is right.
#
# Carried over from shep's own .coderabbit.yaml and cut to what applies to a
# standard-library-only Go module: no Rust paths, no cargo tooling, no
# generated web docs.

language: en-US

tone_instructions: >-
  Be direct and specific. Prose in this repo is hand-written in a deliberate
  voice: flag factual drift, never style or wording. Do not repeat lints that
  CI already enforces as a required check.

reviews:
  # Assertive, not the `chill` default. shep-go carries the shepherd channel
  # an app's readiness and metrics ride on, so a missed defect here costs an
  # operator's app the same way a missed one in shep costs their flock.
  profile: assertive

  auto_review:
    # release-plz would open these once this module has its own release
    # automation, and merging one IS the release: nothing in the diff is
    # unreviewed, since it is a version bump plus a changelog generated from
    # commits already reviewed on their own pull requests.
    #
    # Matched on a LABEL rather than a username or a title keyword. shep's
    # own history found both of those unreliable: a bot posting under the
    # maintainer's own token is indistinguishable from the maintainer by
    # username, and a force-pushed branch does not always re-evaluate a
    # title match.
    labels:
      - "!release"

  path_instructions:
    - path: "channel/**/*.go"
      instructions: >-
        This module is standard library only, by design. `wire.go` is
        generated by shep's wire exporter and is byte-frozen: never
        reformatted or hand-edited. A suggestion to add a dependency should
        say which of those two rules it is arguing with.

    - path: "**/*.md"
      instructions: >-
        Prose here is hand-written in a deliberate voice. Do not suggest
        rewording, tightening, or rewrapping.

    - path: "README.md"
      instructions: >-
        Published prose. Terminology is fixed: the plural of `sheep` is
        `flock`, and the daemon is only ever "the shepherd".

  tools:
    # `typos` is a required check once this repository's CI exists, with its
    # own configuration in _typos.toml. LanguageTool on top of it produces
    # style opinions about deliberate prose, which tone_instructions above
    # already asks it not to do.
    languagetool:
      enabled: false
    markdownlint:
      enabled: false

  # No issue has ever been opened on this repository, and the label set is
  # GitHub's untouched default.
  assess_linked_issues: false
  related_issues: false
  suggested_labels: false
  # One maintainer.
  suggested_reviewers: false
