# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CodeRabbit review settings. A key that is absent here keeps the default.
#
# This config covers a standard-library Go module. It skips Rust paths,
# cargo tooling, and generated web docs.

language: en-US

tone_instructions: >-
  Be direct and specific. Prose in this repo is hand-written in a deliberate
  voice: flag factual drift, never style or wording. Do not repeat lints that
  CI already enforces as a required check.

reviews:
  # Assertive, not the `chill` default. shep-go carries the channel apps use
  # for readiness and metrics. A missed defect here can break an operator's
  # app.
  profile: assertive

  auto_review:
    # Off by default, and a pull request opts in by carrying the marker below
    # in its description. That is as close as this file can get to "review our
    # own branches, not a stranger's fork": CodeRabbit's schema has nine keys
    # under auto_review and not one of them knows what a fork is.
    #
    # What it buys, on a plan that includes one review an hour: a drive-by
    # pull request no longer spends the slot the branch behind it was waiting
    # for. Three arrived on 2026-09-16, within three hours of the first
    # `good first issue` labels going on.
    #
    # What it costs: nothing opened from a fork is reviewed until someone asks.
    # `@coderabbitai review` works on any pull request and is unaffected by
    # this flag, so asking is one comment. It also stops any pull request whose
    # description is written by a bot rather than typed, release pull requests
    # included, since a generated description carries no marker.
    #
    # The marker is an HTML comment, so it renders as nothing. It is spelled
    # `coderabbit-review` rather than `coderabbit` because CodeRabbit edits a
    # release-note block INTO the description after a review and that block
    # contains `coderabbit.ai`. A shorter keyword would match text the tool
    # itself had just added.
    enabled: false
    description_keyword: "<!-- coderabbit-review -->"

    # Still a second gate under `enabled: false`: a negative label stays an
    # exclusion filter, it just no longer carries the job alone. Kept because
    # the two mechanisms ruled out below are the two anyone would try first.
    #
    # release-please opens this one. Merging it is the release. Every
    # commit in it was already reviewed on its own pull request. So the
    # diff itself needs no separate review.
    #
    # Matched on a label, not a username or a title keyword. A bot can
    # post under the maintainer's own token, so username cannot tell them
    # apart. A force-pushed branch does not always re-run a title match.
    #
    # The label is release-please's own default while the pull request is
    # open. It becomes `autorelease: tagged` after the merge, which is
    # past anything this skip could affect.
    labels:
      - "!autorelease: pending"

  path_instructions:
    - path: "channel/**/*.go"
      instructions: >-
        This module is standard library only, by design. `wire.go` is
        generated by shep's wire exporter and is byte-frozen: never
        reformatted or hand-edited. A suggestion to add a dependency should
        say which of those two rules it is arguing with.

    - path: "**/*.md"
      instructions: >-
        Prose here is hand-written in a deliberate voice. Do not suggest
        rewording, tightening, or rewrapping.

    - path: "README.md"
      instructions: >-
        Published prose. Terminology is fixed: the plural of `sheep` is
        `flock`, and the daemon is only ever "the shepherd".

  tools:
    # `typos` is a required check once this repository's CI exists, with its
    # own configuration in _typos.toml. LanguageTool would add style opinions
    # about deliberate prose. tone_instructions above already forbids that.
    languagetool:
      enabled: false
    markdownlint:
      enabled: false

  # This repository has no open issues, and its label set is GitHub's
  # default.
  assess_linked_issues: false
  related_issues: false
  suggested_labels: false
  # One maintainer.
  suggested_reviewers: false
